# Following tests are using Cloud services to ensure the quality of the project.

name: End to end tests
on: [pull_request]

permissions:
  id-token: write
  contents: read

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: azure
    outputs:
      storage_account_name: ${{ steps.terraform-outputs.outputs.STORAGE_ACCOUNT_NAME }}
      resource_group_name: ${{ steps.terraform-outputs.outputs.RESOURCE_GROUP_NAME }}
      sftp_username: ${{ steps.terraform-outputs.outputs.SFTP_USERNAME }}
      sftp_password: ${{ steps.terraform-outputs.outputs.SFTP_PASSWORD }}
      sftp_ssh_private_key: ${{ steps.get-sftp-ssh-key.outputs.SFTP_SSH_PRIVATE_KEY }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: 'Az CLI login'
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      id: init
      run: terraform init
      working-directory: .devcontainer/infra/backbone

    - name: Terraform Apply
      id: apply
      run: terraform apply -auto-approve
      working-directory: .devcontainer/infra/backbone
      env:
        TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
        TF_VAR_client_id: ${{ secrets.AZURE_CLIENT_ID }}
        TF_VAR_run_id: ${{ github.run_id }}

    - name: Cache Terraform State
      uses: actions/cache/save@v3
      with:
        path: .devcontainer/infra/backbone/terraform.tfstate
        key: terraform-state-${{ github.run_id }}

    - name: Get Storage Account Name
      id: get-storage-account
      run: terraform output -no-color -raw storage_account_name
      working-directory: .devcontainer/infra/backbone

    - name: Get Resource Group Name
      id: get-resource-group
      run: terraform output -no-color -raw resource_group_name
      working-directory: .devcontainer/infra/backbone

    - name: Set Outputs
      id: terraform-outputs
      run: |
        echo "STORAGE_ACCOUNT_NAME=${{ steps.get-storage-account.outputs.stdout }}" >> $GITHUB_OUTPUT
        echo "RESOURCE_GROUP_NAME=${{ steps.get-resource-group.outputs.stdout }}" >> $GITHUB_OUTPUT

  tests:
    strategy:
      matrix:
        os: [ubuntu-latest] #, windows-latest, macos-latest]
        python-version: ["3.9"] #, "3.10", "3.11", "3.12", "3.13"]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    needs: infrastructure
    environment: azure

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: 'Az CLI login'
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init (Job Container)
      id: init-job
      run: terraform init
      working-directory: .devcontainer/infra/jobs

    - name: Create Job Container
      id: job-container
      run: terraform apply -auto-approve
      working-directory: .devcontainer/infra/jobs
      env:
        TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
        TF_VAR_client_id: ${{ secrets.AZURE_CLIENT_ID }}
        TF_VAR_run_id: ${{ github.run_id }}
        TF_VAR_os: ${{ matrix.os }}
        TF_VAR_python_version: ${{ matrix.python-version }}
        TF_VAR_storage_account_name: ${{ needs.infrastructure.outputs.storage_account_name }}
        TF_VAR_resource_group_name: ${{ needs.infrastructure.outputs.resource_group_name }}

    - name: Get SFTP Name
      id: get-sftp-name
      run: echo "SFTP_FOLDER=$(terraform output -no-color sftp_name)" >> $GITHUB_ENV
      working-directory: .devcontainer/infra/jobs

    - name: Get SFTP Username
      id: get-sftp-username
      run: terraform output -no-color -raw sftp_username
      working-directory: .devcontainer/infra/jobs

    - name: Get SFTP Password
      id: get-sftp-password
      run: terraform output -no-color -raw sftp_password
      working-directory: .devcontainer/infra/jobs

    - name: Get SFTP SSH Private Key
      id: get-sftp-ssh-key
      run: echo "SFTP_SSH_PRIVATE_KEY=$(terraform output -no-color -raw sftp_ssh_private_key | base64 -w0)" >> $GITHUB_OUTPUT
      working-directory: .devcontainer/infra/jobs

    - name: Get Jsftp folder
      id: get-job-container
      run: |
        echo $SFTP_FOLDER
      working-directory: .devcontainer/infra/jobs

    - name: Install uv
      uses: astral-sh/setup-uv@v3

    - name: Install Azureit to emulate Azure Storage Account locally and moto to emulate AWS S3.
      run: |
        pip install moto[server]
        npm install -g azurite

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install the project
      run: uv sync --all-extras --dev --python ${{ matrix.python-version }}

    - name: Run tests without dependencies
      run: uv run pytest tests/units

    - name: Retrieve SSH key for SFTP tests
      run: |
        # Still keep the existing keys for backward compatibility
        echo ${{ secrets.SFTP_SSH_KEY_ECDSA }} | base64 --decode > /tmp/sftp_key_ecdsa_key
        echo ${{ secrets.SFTP_SSH_KEY_RSA }} | base64 --decode > /tmp/sftp_key_rsa_key

        # Save the Terraform-generated SFTP SSH key
        echo "${{ steps.get-sftp-ssh-key.outputs.stdout }}" | base64 --decode > /tmp/sftp_key_rsa_key
        # cat /tmp/sftp_key_rsa_key
        # echo ${{ needs.infrastructure.outputs.sftp_username }}
        # echo ${{ needs.infrastructure.outputs.sftp_password }}
        # echo ${{ needs.infrastructure.outputs.storage_account_name }}
        # chmod 600 /tmp/sftp_key_rsa_key
        # echo "SFTP_USERNAME=${{ steps.get-sftp-username.outputs.stdout }}" >> $GITHUB_OUTPUT
        # echo "SFTP_PASSWORD=${{ steps.get-sftp-password.outputs.stdout }}" >> $GITHUB_OUTPUT
      shell: bash

    - name: Run end-to-end tests interracting with Azure, AWS and SFTP
      run: uv run --python ${{ matrix.python-version }} pytest -m "azure or aws or sftp" tests/end-to-end
      env:
        AWS_KEY_ID: ${{ secrets.AWS_ENVIRONMENT_KEY }}
        AWS_KEY_SECRET: ${{ secrets.AWS_ENVIRONMENT_SECRET }}
        AZURE_STORAGE_ACCESS_KEY: ${{ secrets.AZURE_STORAGE_ACCESS_KEY }}
        AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        ENCRYPTION_KEY: "Sixteen byte key"
        SFTP_PASSWORD_HOSTNAME: ${{ needs.infrastructure.outputs.storage_account_name }}.blob.core.windows.net
        SFTP_SSH_HOSTNAME: ${{ needs.infrastructure.outputs.storage_account_name }}.blob.core.windows.net
        SFTP_USERNAME: ${{ steps.get-sftp-username.outputs.stdout }}
        SFTP_PASSWORD: ${{ steps.get-sftp-password.outputs.stdout }}
        SFTP_SSH_KEY_ECDSA: /tmp/sftp_key_rsa_key #/tmp/sftp_key_ecdsa_key
        SFTP_SSH_KEY_RSA: /tmp/sftp_key_rsa_key
      shell: bash

    - name: Run end-to-end tests with simulator
      run: |
        # Start dependencies
        azurite --silent --location c:\azurite --debug c:\azurite\debug.log &
        moto_server -p9000 &

        # Run tests
        uv run --python ${{ matrix.python-version }} pytest -m "(not azure) and (not aws) and (not sftp)" tests/end-to-end
      env:
        AWS_ENDPOINT_URL: "http://127.0.0.1:9000"
        AWS_KEY_ID: "moto"
        AWS_KEY_SECRET: "moto"
        AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;"
        ENCRYPTION_KEY: "Sixteen byte key"
        SFTP_PASSWORD_HOSTNAME: ${{ needs.infrastructure.outputs.storage_account_name }}.blob.core.windows.net
        SFTP_USERNAME: ${{ needs.infrastructure.outputs.sftp_username }}
        SFTP_PASSWORD: ${{ needs.infrastructure.outputs.sftp_password }}
        SFTP_SSH_KEY_ECDSA: /tmp/sftp_key_ecdsa_key
        SFTP_SSH_KEY_RSA: /tmp/sftp_key_rsa_key
        SFTP_SSH_KEY_TERRAFORM: /tmp/sftp_terraform_key

  cleanup:
    runs-on: ubuntu-latest
    needs: [infrastructure, tests]
    if: always()
    environment: azure
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: 'Az CLI login'
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Restore Terraform State
      uses: actions/cache/restore@v3
      with:
        path: .devcontainer/infra/backbone/terraform.tfstate
        key: terraform-state-${{ github.run_id }}
        fail-on-cache-miss: true

    - name: Terraform Init
      id: init
      run: terraform init
      working-directory: .devcontainer/infra/backbone

    - name: Terraform Destroy
      id: destroy
      run: terraform destroy -auto-approve
      working-directory: .devcontainer/infra/backbone
      env:
        TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
        TF_VAR_client_id: ${{ secrets.AZURE_CLIENT_ID }}
        TF_VAR_run_id: ${{ github.run_id }}

    - name: Delete Terraform State Cache
      run: |
        echo "Cleaning up Terraform state cache..."
        rm -f .devcontainer/infra/backbone/terraform.tfstate*
      shell: bash
