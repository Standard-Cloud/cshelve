[default]
provider                    = sftp
hostname                    = sftp-password
username                    = cshelve
password                    = cloud-shelve
auth_type                   = username_password

[compression]
algorithm   = zlib
level       = 1

[encryption]
algorithm       = aes256
environment_key = ENCRYPTION_KEY

[provider_params]
accept_unknown_host_keys    = true
remote_path                 = upload/encryption-and-compression
