[default]
providers = primary-cache, secondary-cache, tertiary-cache, aws-remote
provider_routing = all

[primary-cache]
provider = in-memory
persist-key = primary
exists = true

# Default compression level 6
[primary-cache.compression]
algorithm = zlib
level = 6

[secondary-cache]
provider = in-memory
persist-key = secondary
exists = true

# High compression for secondary cache
[secondary-cache.compression]
algorithm = zlib
level = 9

[tertiary-cache]
provider = in-memory
persist-key = tertiary
exists = true

[aws-remote]
provider        = aws-s3
bucket_name     = cshelve
auth_type       = access_key
key_id          = $AWS_KEY_ID
key_secret      = $AWS_KEY_SECRET

[aws-remote.provider_params]
endpoint_url = $AWS_ENDPOINT_URL

[aws-remote.encryption]
algorithm       = aes256
environment_key = ENCRYPTION_KEY
