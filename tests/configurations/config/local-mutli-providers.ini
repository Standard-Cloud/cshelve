[default]
providers = write-local, memory-cache
strategy = all

# By default, use zlib compression with level 1
[compression]
algorithm = zlib
level = 1

# By default, use encryption
[encryption]
algorithm       = aes256
environment_key = ENCRYPTION_KEY

[write-local]
provider = filesystem
path = /tmp/cache

[write-local.encryption]
algorithm = None
environment_key = ENCRYPTION_KEY

[memory-cache]
provider        = in-memory
persist-key     = standard
exists          = true
