[default]
providers = fast-local, aws-remote, azure
provider_routing = all

# By default, use zlib compression with level 1
[compression]
algorithm = zlib
level = 1

# By default, use encryption
[encryption]
algorithm       = aes256
environment_key = ENCRYPTION_KEY

[fast-local]
provider = filesystem
folder_path = /tmp/cache

[fast-local.provider_params]
whatever = value

[aws-remote]
provider        = aws-s3
bucket_name     = cshelve
auth_type       = access_key
key_id          = $AWS_KEY_ID
key_secret      = $AWS_KEY_SECRET

[aws-remote.compression]
algorithm = zlib
level = 9

[azure]
provider = azure-blob
auth_type = connection_string
environment_key = AZURE_STORAGE_CONNECTION_STRING
container_name = cshelve

[azure.encryption]
algorithm = None
